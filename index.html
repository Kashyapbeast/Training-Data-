<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Trainer Calendar | L&D Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>


<style>

/* =========================================================
   ROOT
========================================================= */

:root{

  --navy:#18324a;
  --blue:#3e7ca1;
  --teal:#43a99b;
  --orange:#efaa55;
  --purple:#9b78c5;

  --ink:#1d2b38;
  --muted:#74818c;

  --line:#e4e9ee;
  --bg:#f5f7fa;

}


/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
}

body{

  background:var(--bg);

  font-family:
    Inter,
    "Segoe UI",
    Arial,
    sans-serif;

  color:var(--ink);

}


/* =========================================================
   MAIN APP
========================================================= */

.app{

  width:100%;
  max-width:1320px;

  margin:0 auto;

  padding:26px;

}


/* =========================================================
   HERO
========================================================= */

.hero{

  background:
    linear-gradient(
      135deg,
      #18324a 0%,
      #32647f 58%,
      #63a2a9 100%
    );

  color:white;

  border-radius:22px;

  padding:28px 30px;

  box-shadow:
    0 12px 35px
    rgba(24,50,74,.16);

}


.eyebrow{

  font-size:11px;

  font-weight:800;

  letter-spacing:1.6px;

  opacity:.75;

}


.hero h1{

  font-size:31px;

  margin:5px 0;

}


.hero p{

  margin:0;

  font-size:13px;

  opacity:.8;

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

  display:flex;

  gap:12px;

  flex-wrap:wrap;

  align-items:flex-end;

  margin-top:22px;

}


.toolbar label{

  display:flex;

  flex-direction:column;

  gap:6px;

  font-size:10px;

  font-weight:800;

  letter-spacing:.7px;

}


select,
.button{

  min-height:46px;

  border:0;

  border-radius:11px;

  padding:0 15px;

  font-size:14px;

  background:white;

  color:var(--ink);

}


select{

  min-width:190px;

}


.button{

  cursor:pointer;

  font-weight:800;

}


.download{

  background:#ffd166;

}


/* =========================================================
   KPI CARDS
========================================================= */

.kpis{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:14px;

  margin:18px 0;

}


.kpi{

  background:white;

  border:1px solid var(--line);

  border-radius:16px;

  padding:17px;

  box-shadow:
    0 4px 16px
    rgba(25,45,60,.045);

  border-top:4px solid var(--blue);

  min-width:0;

}


.kpi:nth-child(2){

  border-top-color:var(--teal);

}


.kpi:nth-child(3){

  border-top-color:var(--orange);

}


.kpi:nth-child(4){

  border-top-color:var(--purple);

}


.klabel{

  font-size:11px;

  color:var(--muted);

  font-weight:800;

}


.kvalue{

  font-size:26px;

  font-weight:800;

  margin-top:6px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


/* =========================================================
   CALENDAR CARD
========================================================= */

.calendar-card{

  width:100%;

  background:white;

  border:1px solid var(--line);

  border-radius:17px;

  overflow:hidden;

  box-shadow:
    0 4px 16px
    rgba(25,45,60,.045);

}


/* =========================================================
   CALENDAR HEADER
========================================================= */

.cal-top{

  padding:18px 20px;

  border-bottom:1px solid var(--line);

}


.cal-title{

  font-size:20px;

  font-weight:800;

}


.cal-sub{

  font-size:12px;

  color:var(--muted);

  margin-top:3px;

}


/* =========================================================
   WEEK HEADER
========================================================= */

.week,
.days{

  display:grid;

  grid-template-columns:
    repeat(7,minmax(0,1fr));

  width:100%;

}


.week div{

  padding:11px 5px;

  background:#f8fafc;

  border-right:1px solid #edf0f2;

  color:#71808b;

  font-size:10px;

  font-weight:800;

  text-align:center;

}


/* =========================================================
   CALENDAR CELLS
========================================================= */

.cell{

  min-height:135px;

  padding:8px;

  border-right:1px solid #edf0f2;

  border-bottom:1px solid #edf0f2;

  background:white;

  overflow:hidden;

}


.cell.muted{

  background:#fbfcfd;

}


.date{

  font-size:12px;

  font-weight:800;

  color:#657582;

  margin-bottom:4px;

}


/* =========================================================
   TRAINING EVENT
========================================================= */

.event{

  padding:8px;

  border-radius:9px;

  margin-top:7px;

  font-size:10px;

  line-height:1.35;

  border-left:
    4px solid var(--blue);

  background:#eaf3ff;

  overflow:hidden;

}


.event strong{

  display:block;

  font-size:10.5px;

  margin-bottom:3px;

}


.event small{

  color:#60727f;

}


/* =========================================================
   UNSCHEDULED
========================================================= */

.unscheduled{

  margin-top:16px;

}


.notice{

  padding:13px 15px;

  border:1px solid var(--line);

  border-radius:11px;

  background:white;

  font-size:12px;

  color:var(--muted);

  margin-bottom:8px;

}


.notice strong{

  color:var(--ink);

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

  font-size:11px;

  color:#84919a;

  text-align:center;

  margin:14px;

}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:900px){

  .app{

    padding:18px;

  }


  .kpis{

    grid-template-columns:
      repeat(2,1fr);

}


/* =========================================================

========================================================= */

  .eyebrow{

  ------------------------- */

    margin-top:15px;

  }

    font-size:9px;

  /* -------------------------
     KPIs

  .kpis{

    display:grid;

      repeat(2,minmax(0,1fr));

  }

  /* -------------------------

    font-size:11px;

  .week,

  /* -------------------------

  ------------------------- */

  .notice{

    padding:11px 12px;

    border-radius:11px;

    font-size:11.5px;

    margin-bottom:6px;

  ------------------------- */

/* =========================================================

<script>


/* =========================================================
   GOOGLE SHEET API
========================================================= */

const API_URL =
'https://script.google.com/macros/s/AKfycbyjXfCi7vXXm-AReBacZgiUwBKtH3Hx8_tTrZmJKufQ4CN8bU_ljApqSSOekJtus3I2/exec';


let records = [];


const $ =
  id =>
  document.getElementById(id);


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(v){

  return String(v ?? '')
    .replace(
      /[&<>"']/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );

}


/* =========================================================
   MONTH CLEANER
========================================================= */

function cleanMonth(
  v,
  fallback='September 2026'
){

  const s =
    String(v || '').trim();


  const m =
    s.match(
      /(January|February|March|April|May|June|July|August|September|October|November|December)\s*[-\/]?\s*(\d{4})?/i
    );


  if(!m){

    return fallback;

  }


  return (
    m[1].replace(
      /^./,
      x => x.toUpperCase()
    )
    +
    ' '
    +
    (m[2] || '2026')
  );

}


/* =========================================================
   HOURS CALCULATOR
========================================================= */

function hoursFromTime(t){

  const s =
    String(t || '')
      .toLowerCase()
      .replace(/\s+/g,' ');


  const m =
    s.match(
      /(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:to|[-–—])\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/
    );


  if(!m){

    return 0;

  }


  let a =
    +m[1] +
    (+m[2] || 0) / 60;


  let b =
    +m[4] +
    (+m[5] || 0) / 60;


  let ap = m[3];

  let bp = m[6];


  if(!bp){

    bp = ap;

  }


  if(!ap && bp){

    ap =
      bp === 'am'
        ? 'am'
        : (
          +m[4] === 12 ||
          +m[4] < +m[1]
            ? 'am'
            : 'pm'
        );

  }


  if(ap === 'pm' && a < 12){

    a += 12;

  }


  if(ap === 'am' && a === 12){

    a = 0;

  }


  if(bp === 'pm' && b < 12){

    b += 12;

  }


  if(bp === 'am' && b === 12){

    b = 0;

  }


  return b > a
    ? b-a
    : 0;

}


/* =========================================================
   PARSE DAYS
========================================================= */

function parseDays(
  value,
  month
){

  const s =
    String(value || '').trim();


  /*
    No scheduled date
  */

  if(
    !s ||
    /date to be finalized|tentative/i.test(s)
  ){

    return [];

  }


  const base =
    new Date(
      month + ' 1'
    );


  if(
    Number.isNaN(
      base.getTime()
    )
  ){

    return [];

  }


  const y =
    base.getFullYear();


  const mo =
    base.getMonth();


  const last =
    new Date(
      y,
      mo + 1,
      0
    ).getDate();


  const out = [];


  const ord = {

    first:1,
    second:2,
    third:3,
    fourth:4,
    fifth:5,

    '1st':1,
    '2nd':2,
    '3rd':3,
    '4th':4,
    '5th':5

  };


  const wd = {

    sunday:0,
    monday:1,
    tuesday:2,
    wednesday:3,
    thursday:4,
    friday:5,
    saturday:6

  };


  const lower =
    s.toLowerCase();


  let ordinal = false;


  /*
    First Monday etc.
  */

  for(
    const [n,num]
    of Object.entries(ord)
  ){

    for(
      const [w,wday]
      of Object.entries(wd)
    ){

      if(
        new RegExp(
          '\\b' +
          n +
          '\\s+' +
          w +
          '\\b',
          'i'
        ).test(lower)
      ){

        ordinal = true;


        const first =
          new Date(
            y,
            mo,
            1
          );


        const offset =
          (
            wday -
            first.getDay() +
            7
          ) % 7;


        const day =
          1 +
          offset +
          (num-1)*7;


        if(day <= last){

          out.push(day);

        }

      }

    }

  }


  /*
    Every Monday etc.
  */

  if(
    !ordinal &&
    /every|all|weekly/i.test(s)
  ){

    for(
      const w
      of Object.keys(wd)
    ){

      if(
        lower.includes(w)
      ){

        for(
          let d=1;
          d<=last;
          d++
        ){

          if(
            new Date(
              y,
              mo,
              d
            ).getDay()
            ===
            wd[w]
          ){

            out.push(d);

          }

        }

      }

    }

  }


  /*
    Explicit numbers
  */

  const cleaned =
    s.replace(
      /\b(?:first|second|third|fourth|fifth|1st|2nd|3rd|4th|5th)(?:\s*(?:or|&|and)\s*(?:first|second|third|fourth|fifth|1st|2nd|3rd|4th|5th))*\s+(?:sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/gi,
      ''
    );


  const explicit =
    cleaned.match(
      /\b\d{1,2}(?:st|nd|rd|th)?\b/gi
    ) || [];


  explicit.forEach(
    n => {

      const d =
        parseInt(
          n,
          10
        );


      if(
        d >= 1 &&
        d <= last
      ){

        out.push(d);

      }

    }
  );


  /*
    Saturdays
  */

  if(
    !out.length &&
    /\b(saturdays|saturday)\b/i.test(s)
  ){

    for(
      let d=1;
      d<=last;
      d++
    ){

      if(
        new Date(
          y,
          mo,
          d
        ).getDay()
        === 6
      ){

        out.push(d);

      }

    }

  }


  return [
    ...new Set(out)
  ].sort(
    (a,b) => a-b
  );

}


/* =========================================================
   EXPAND RECORDS
========================================================= */

function expanded(){

  const out = [];

  const seen =
    new Set();


  for(
    const r
    of records
  ){

    const month =
      cleanMonth(
        r.month
      );


    const days =
      parseDays(
        r.date,
        month
      );


    for(
      const day
      of days
    ){

      const key = [

        r.trainer,
        r.trainingName,
        month,
        day,
        r.time

      ]
      .map(
        x =>
          String(
            x || ''
          )
          .trim()
          .toLowerCase()
      )
      .join('|');


      if(
        seen.has(key)
      ){

        continue;

      }


      seen.add(key);


      out.push({

        ...r,

        day

      });

    }

  }


  return out;

}


/* =========================================================
   INITIALIZE
========================================================= */

function init(){

  /*
    Trainers
  */

  const trainers = [

    'All Trainers',

    ...new Set(
      records
        .map(
          r => String(
            r.trainer || ''
          ).trim()
        )
        .filter(Boolean)
    )

  ];


  /*
    Months
  */

  const months = [

    ...new Set(
      records
        .map(
          r =>
            cleanMonth(
              r.month
            )
        )
    )

  ]
  .sort(
    (a,b) =>
      new Date(a) -
      new Date(b)
  );


  /*
    Always allow September 2026
  */

  if(
    !months.includes(
      'September 2026'
    )
  ){

    months.unshift(
      'September 2026'
    );

  }


  /*
    Trainer dropdown
  */

  $('trainer').innerHTML =
    trainers
      .map(
        x =>
          `<option value="${esc(x)}">${esc(x)}</option>`
      )
      .join('');


  /*
    Month dropdown
  */

  $('month').innerHTML =
    months
      .map(
        x =>
          `<option value="${esc(x)}">${esc(x)}</option>`
      )
      .join('');


  /*
    Default month
  */

  if(
    months.includes(
      'September 2026'
    )
  ){

    $('month').value =
      'September 2026';

  }


  /*
    Filter events
  */

  $('trainer').onchange =
    update;


  $('month').onchange =
    update;


  /*
    PDF
  */

  $('download').onclick =
    function(){

      html2pdf()
        .from(
          $('pdfArea')
        )
        .set({

          margin:8,

          filename:
            `Trainer-Calendar-${$('trainer').value}-${$('month').value}.pdf`,

          html2canvas:{
            scale:1.5
          },

          jsPDF:{
            format:'a4',
            orientation:'landscape'
          }

        })
        .save();

    };


  update();

}


/* =========================================================
   FILTER DATA
========================================================= */

function getFilteredRecords(){

  const trainer =
    String(
      $('trainer').value || ''
    ).trim();


  const month =
    $('month').value;


  return records.filter(
    r => {

      const recordMonth =
        cleanMonth(
          r.month
        );


      const recordTrainer =
        String(
          r.trainer || ''
        ).trim();


      return (

        recordMonth === month &&

        (
          trainer === 'All Trainers' ||
          recordTrainer === trainer
        )

      );

    }
  );

}


/* =========================================================
   UPDATE EVERYTHING
========================================================= */

function update(){

  const trainer =
    String(
      $('trainer').value || ''
    ).trim();


  const month =
    $('month').value;


  /*
    Filter base records
  */

  const base =
    getFilteredRecords();


  /*
    Scheduled events
  */

  const events =
    expanded().filter(
      r => {

        const monthMatch =
          cleanMonth(
            r.month
          ) === month;


        const trainerMatch =
          trainer === 'All Trainers' ||
          String(
            r.trainer || ''
          ).trim()
          ===
          trainer;


        return (
          monthMatch &&
          trainerMatch
        );

      }
    );


  /*
    Training hours
  */

  const hrs =
    events.reduce(
      (total,event) =>
        total +
        hoursFromTime(
          event.time
        ),
      0
    );


  /*
    Participants
  */

  const participants =
    base.reduce(
      (total,r) => {

        const number =
          parseInt(
            String(
              r.participants || ''
            )
            .replace(
              /[^0-9]/g,
              ''
            ),
            10
          ) || 0;


        return total + number;

      },
      0
    );


  /*
    KPIs
  */

  $('sessions').textContent =
    events.length;


  $('hours').textContent =
    (
      Math.round(
        hrs * 10
      ) / 10
    )
    +
    ' hrs';


  $('participants').textContent =
    participants || '—';


  /*
    Trainer KPI
  */

  $('fourthLabel').textContent =
    trainer === 'All Trainers'
      ? 'ACTIVE TRAINERS'
      : 'TRAINER';


  $('fourthValue').textContent =
    trainer === 'All Trainers'

      ?

      new Set(
        base
          .map(
            r =>
              String(
                r.trainer || ''
              ).trim()
          )
          .filter(Boolean)
      ).size

      :

      trainer;


  /*
    Header
  */

  $('subtitle').textContent =
    'Live Google Sheet · ' +
    month +
    ' · ' +
    trainer;


  $('calTitle').textContent =
    month;


  $('calSub').textContent =
    trainer;


  /*
    Render
  */

  renderCalendar(
    events,
    month
  );


  renderUnscheduled(
    base
  );

}


/* =========================================================
   RENDER CALENDAR
========================================================= */

function renderCalendar(
  events,
  month
){

  const date =
    new Date(
      month + ' 1'
    );


  const year =
    date.getFullYear();


  const monthIndex =
    date.getMonth();


  /*
    Monday = 0
    Sunday = 6
  */

  const firstDay =
    (
      date.getDay() + 6
    ) % 7;


  const lastDay =
    new Date(
      year,
      monthIndex + 1,
      0
    ).getDate();


  const totalCells =
    Math.ceil(
      (
        firstDay +
        lastDay
      ) / 7
    ) * 7;


  /*
    Group events by date
  */

  const byDay = {};


  events.forEach(
    event => {

      if(
        !byDay[event.day]
      ){

        byDay[event.day] = [];

      }


      byDay[event.day].push(
        event
      );

    }
  );


  /*
    Clear calendar
  */

  $('days').innerHTML = '';


  /*
    Build calendar
  */

  for(
    let i=0;
    i<totalCells;
    i++
  ){

    const day =
      i -
      firstDay +
      1;


    const cell =
      document.createElement(
        'div'
      );


    cell.className =
      'cell';


    /*
      Previous/next month cells
    */

    if(
      day < 1 ||
      day > lastDay
    ){

      cell.classList.add(
        'muted'
      );


      $('days').appendChild(
        cell
      );


      continue;

    }


    /*
      Date number
    */

    cell.innerHTML =
      `
      <div class="date">
        ${day}
      </div>
      `;


    /*
      Events
    */

    const dayEvents =
      byDay[day] || [];


    dayEvents.forEach(
      (event,index) => {

        const colors = [

          '#3e7ca1',
          '#43a99b',
          '#efaa55',
          '#9b78c5'

        ];


        const backgrounds = [

          '#eaf3ff',
          '#e9f8f3',
          '#fff2e3',
          '#f4ebfa'

        ];


        const eventDiv =
          document.createElement(
            'div'
          );


        eventDiv.className =
          'event';


        eventDiv.style.borderLeftColor =
          colors[
            index % colors.length
          ];


        eventDiv.style.background =
          backgrounds[
            index % backgrounds.length
          ];


        eventDiv.innerHTML =
          `

          <strong>
            ${esc(
              event.trainingName ||
              'Training'
            )}
          </strong>

          ${esc(
            event.time ||
            'Time not set'
          )}

          <br>

          <small>
            ${esc(
              event.trainer ||
              ''
            )}

            ${
              event.mode
                ? ' · ' +
                  esc(event.mode)
                : ''
            }

          </small>

          `;


        cell.appendChild(
          eventDiv
        );

      }
    );


    /*
      Add cell
    */

    $('days').appendChild(
      cell
    );

  }

}


/* =========================================================
   UNSCHEDULED / TENTATIVE
========================================================= */

function renderUnscheduled(
  rows
){

  const tentative =
    rows.filter(
      r =>
        parseDays(
          r.date,
          cleanMonth(
            r.month
          )
        ).length === 0
    );


  if(
    !tentative.length
  ){

    $('unscheduled').innerHTML =
      '';

    return;

  }


  let html =
    `

    <div class="notice">

      <strong>
        Unscheduled / tentative ·
        ${tentative.length}
      </strong>

    </div>

    `;


  tentative.forEach(
    r => {

      html +=
        `

        <div class="notice">

          <strong>
            ${esc(
              r.trainingName ||
              'Training'
            )}
          </strong>

          <br>

          ${esc(
            r.date ||
            'Date to be finalized'
          )}

        </div>

        `;

    }
  );


  $('unscheduled').innerHTML =
    html;

}


/* =========================================================
   LOAD DATA
========================================================= */

async function load(){

  try{

    $('subtitle').textContent =
      'Connecting to Google Sheet…';


    const response =
      await fetch(
        API_URL +
        '?t=' +
        Date.now(),
        {
          cache:'no-store'
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        'API ' +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      !data.success
    ){

      throw new Error(
        'API error'
      );

    }


    records =
      Array.isArray(
        data.records
      )
        ? data.records
        : [];


    init();

  }

  catch(error){

    console.error(
      error
    );


    $('subtitle').textContent =
      'Could not connect to Google Sheet. Check Apps Script deployment access.';

  }

}


/* =========================================================
   START
========================================================= */

load();


</script>
